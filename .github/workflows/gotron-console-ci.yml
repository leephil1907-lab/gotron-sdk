name: GoTRON Console CI

on:
  push:
    branches:
      - master
      - feature/tron-dashboard-app
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run SDK and application tests
        run: go test ./...
      - name: Build GoTRON Console
        run: go build -o /tmp/gotron-console ./app
